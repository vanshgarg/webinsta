<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logo-grid-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#7C3AED" />
      <stop offset="40%" stopColor="#C084FC" />
      <stop offset="70%" stopColor="#FF7E40" />
      <stop offset="100%" stopColor="#FF5722" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1" />
    </filter>
  </defs>
  <!-- A beautiful rounded white board container to ensure full visibility on both dark/light browser tabs -->
  <rect width="90" height="90" x="5" y="5" rx="24" fill="#FFFFFF" filter="url(#shadow)" />
  <path
    d="M 22 46 C 22 46, 34 76, 43 76 C 48 76, 50 51, 55 51 C 60 51, 62 76, 67 76 C 73 76, 81 48, 81 48"
    fill="none"
    stroke="url(#logo-grid-grad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="80" cy="24" r="9" fill="url(#logo-grid-grad)" />
</svg>
